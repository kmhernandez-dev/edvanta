[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Las funciones (/.netlify/functions/*) las resuelve Netlify automáticamente
# ANTES de este redirect SPA, así que no necesitan regla propia.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
