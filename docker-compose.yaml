# ============================================================
# docker-compose.yaml — edvanta.co
# Para Coolify (build_pack: dockercompose)
#
# Servicios:
#   web — frontend React servido por nginx
#         (también hace proxy_pass /api/* → api:3000)
#   api — backend Node/Express
#
# En producción con Cloudflare + dominio edvanta.co:
#   - edvanta.co y www.edvanta.co → web (puerto 80)
#   - api.edvanta.co → web (puerto 80, con /api/* proxy al api)
#     O directamente al api si Coolify expone el segundo puerto.
#
# Postgres corre como servicio aparte en Coolify (no aquí).
# Coolify inyecta DATABASE_URL cuando enlaza el servicio de Postgres.
# ============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edvanta-web
    restart: unless-stopped
    ports:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_started
    networks:
      - edvanta-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: edvanta-api
    restart: unless-stopped
    # El api no expone puertos al host: solo es accesible desde
    # la red interna de docker-compose. El web hace proxy_pass.
    expose:
      - "3000"
    environment:
      PORT: "3000"
      CORS_ORIGINS: "https://edvanta.co,https://www.edvanta.co"
      SITE_URL: "https://edvanta.co"
      API_URL: "https://edvanta.co"
      DATABASE_URL: "${DATABASE_URL}"
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      FROM_EMAIL: "${FROM_EMAIL}"
      NOTIFY_EMAIL: "${NOTIFY_EMAIL}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edvanta-net

networks:
  edvanta-net:
    driver: bridge