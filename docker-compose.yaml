services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.edvanta-gzip.compress=true"
      - "traefik.http.routers.edvanta-web-http.entryPoints=http"
      - "traefik.http.routers.edvanta-web-http.middlewares=edvanta-gzip"
      - "traefik.http.routers.edvanta-web-http.rule=(Host(`edvanta.co`) || Host(`www.edvanta.co`)) && PathPrefix(`/`)"
      - "traefik.http.routers.edvanta-web-http.service=edvanta-web"
      - "traefik.http.routers.edvanta-web-https.entryPoints=https"
      - "traefik.http.routers.edvanta-web-https.middlewares=edvanta-gzip"
      - "traefik.http.routers.edvanta-web-https.rule=(Host(`edvanta.co`) || Host(`www.edvanta.co`)) && PathPrefix(`/`)"
      - "traefik.http.routers.edvanta-web-https.service=edvanta-web"
      - "traefik.http.routers.edvanta-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.edvanta-web-https.tls=true"
      - "traefik.http.services.edvanta-web.loadbalancer.server.port=80"
    depends_on:
      api:
        condition: service_started
    networks:
      - edvanta-net
      - coolify

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGINS: "http://edvanta.co,https://edvanta.co,http://www.edvanta.co,https://www.edvanta.co"
      SITE_URL: "https://edvanta.co"
      API_URL: "https://edvanta.co"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN:?MP_ACCESS_TOKEN is required}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY is required}"
      FROM_EMAIL: "${FROM_EMAIL:?FROM_EMAIL is required}"
      NOTIFY_EMAIL: "${NOTIFY_EMAIL:-${FROM_EMAIL}}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      JWT_SECRET: "${JWT_SECRET:-${ADMIN_TOKEN}}"
    networks:
      - edvanta-net
      - coolify

networks:
  edvanta-net:
    driver: bridge

  coolify:
    external: true
    name: coolify
