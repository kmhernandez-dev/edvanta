# ============================================================
# nginx.conf — Sirve el SPA React compilado.
#
# Características:
#   - SPA fallback: cualquier ruta no existente → /index.html
#   - Cache largo para assets con hash en el nombre (/assets/*)
#   - Sin cache para index.html (para que los deploys sean inmediatos)
#   - Headers de seguridad básicos
# ============================================================
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Cache largo para assets con hash (vite usa /assets/xxxx.[hash].js)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Sin cache para index.html
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # SPA fallback: cualquier ruta no existente → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Headers de seguridad
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
