# ============================================================
# nginx.conf — Sirve el SPA React compilado + proxy /api → backend
#
# En docker-compose, el servicio api está accesible en la red interna
# como "api:3000" (nombre del servicio + puerto).
#
# Características:
#   - Proxy /api/* → backend Node (incluye /api/health y /api/health/db)
#   - Proxy /health (liveness)
#   - SPA fallback: cualquier ruta no existente → /index.html
#   - Cache largo para assets con hash en el nombre (/assets/*)
#   - Sin cache para index.html (para deploys inmediatos)
#   - Headers de seguridad básicos
#   - Timeout largo para webhook de MP (puede tardar en confirmar)
# ============================================================

upstream edvanta_api {
    server api:3000;
    keepalive 16;
}

# Upstream separado con timeouts largos para webhooks lentos (Mercado Pago).
upstream edvanta_api_webhooks {
    server api:3000;
    keepalive 8;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Compresión gzip ────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/vnd.ms-fontobject
    image/svg+xml;

  # ── Webhooks (MP, etc.) — timeout largo ────────────────────
  location ~ ^/api/(mp-webhook) {
    proxy_pass http://edvanta_api_webhooks;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # ── API general ────────────────────────────────────────────
  location /api/ {
    proxy_pass http://edvanta_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
  }

  # ── Health checks (para load balancer / monitoring) ────────
  location = /health {
    proxy_pass http://edvanta_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /api/health {
    proxy_pass http://edvanta_api/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /api/health/db {
    proxy_pass http://edvanta_api/api/health/db;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Assets estáticos con cache largo ────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Sin cache para index.html (para que los deploys sean inmediatos)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # ── SPA fallback ────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Headers de seguridad ────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
