# ============================================================
# nginx.conf — Sirve el SPA React compilado + proxy /api → backend
#
# En docker-compose, el servicio api está accesible en la red interna
# como "api:3000" (nombre del servicio + puerto).
#
# Importante: usamos una variable $api_upstream para forzar a nginx
# a re-resolver el hostname "api" en cada request (con resolver
# ipv6=off para evitar Connection refused en IPv6).
#
# Características:
#   - Proxy /api/* → backend Node (incluye /api/health y /api/health/db)
#   - Proxy /health (liveness)
#   - SPA fallback: cualquier ruta no existente → /index.html
#   - Cache largo para assets con hash en el nombre (/assets/*)
#   - Sin cache para index.html (para deploys inmediatos)
#   - Headers de seguridad básicos
#   - Timeout largo para webhook de MP (puede tardar en confirmar)
# ============================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Resolver de Docker (127.0.0.11) para resolver el hostname "api".
  # ipv6=off fuerza IPv4 solo (evita Connection refused en IPv6).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Variable que se resuelve en runtime contra el DNS de Docker.
  # Esto fuerza a nginx a re-resolver el hostname cada vez (no cachear
  # la IP para siempre, que era el problema con upstream blocks).
  set $api_upstream "http://api:3000";

  # ── Compresión gzip ────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/vnd.ms-fontobject
    image/svg+xml;

  # ── Webhooks (MP, etc.) — timeout largo ────────────────────
  location ~ ^/api/(mp-webhook) {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # ── Aula virtual ───────────────────────────────────────────
  # Subidas por partes de hasta 64 MB (el límite por defecto es 1 MB) y
  # archivos servidos en streaming con rangos para que el video avance
  # sin descargarse completo.
  location ^~ /api/aula/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 72m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 5s;
  }

  # ── API general ────────────────────────────────────────────
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
  }

  # ── Health checks (para load balancer / monitoring) ────────
  location = /health {
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /api/health {
    proxy_pass $api_upstream/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /api/health/db {
    proxy_pass $api_upstream/api/health/db;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Módulos .mjs (worker de pdf.js) ─────────────────────────
  # La imagen de nginx no trae el tipo de .mjs y lo entregaba como
  # application/octet-stream: el navegador rechaza un módulo con ese tipo
  # y ningún PDF se podía abrir (hojas de vida ni visor del aula).
  # «types {}» vacía el mapa solo en este bloque para que aplique
  # default_type.
  location ~* ^/assets/.+\.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Assets estáticos con cache largo ────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Imágenes y descargas: cache moderado (no cambian con cada deploy)
  location /img/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  location /descargas/ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
  }

  # Sin cache para index.html (para que los deploys sean inmediatos)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # ── Redirección permanente /index-es.html → / ───────────────
  # Evita duplicidad de URL en Google. La URL canónica única es /.
  location = /index-es.html {
    return 301 https://edvanta.co/;
  }

  # ── Direcciones que cambiaron con la arquitectura de escuelas ──
  # 301 a su destino equivalente (no al inicio): /empresas y su página
  # de capacitación se fusionaron en /instituciones, y el centro de
  # aprendizaje en /escuelas. /empresas/talento sigue igual.
  location = /empresas              { return 301 https://$host/instituciones; }
  location = /empresas/             { return 301 https://$host/instituciones; }
  location = /empresas/capacitacion { return 301 https://$host/instituciones/paquetes/equipo-que-cuida; }
  location = /aprende               { return 301 https://$host/escuelas; }

  # ── Direcciones descriptivas (src/data/edvanta/direcciones.js) ──
  # Cada página que tenía un nombre en inglés, abreviado o genérico
  # redirige, en un solo salto, a su dirección en español. La prueba
  # src/__tests__/direcciones.test.jsx comprueba que cada fila del archivo
  # de datos tenga aquí su 301. No borrar: los enlaces viejos siguen
  # circulando (mínimo un año; mejor, para siempre).
  location = /herramientas/cv-builder      { return 301 https://$host/herramientas/creador-de-hoja-de-vida$is_args$args; }
  location = /herramientas/analizador-ats  { return 301 https://$host/herramientas/analizador-ats-de-hoja-de-vida$is_args$args; }
  location = /herramientas/correos-rrhh    { return 301 https://$host/herramientas/plantillas-de-correo-para-recursos-humanos$is_args$args; }
  location = /herramientas/banco-vacantes  { return 301 https://$host/herramientas/banco-de-vacantes-farmaceuticas$is_args$args; }
  location = /herramientas/linkedin        { return 301 https://$host/herramientas/guia-para-mejorar-linkedin$is_args$args; }
  location = /herramientas/practicas       { return 301 https://$host/herramientas/practicas-farmaceuticas$is_args$args; }
  location = /herramientas/emprende        { return 301 https://$host/herramientas/emprendimiento-farmaceutico$is_args$args; }
  location = /herramientas/perfil-empresas { return 301 https://$host/herramientas/perfil-profesional-para-empresas$is_args$args; }
  location = /competencias/change-control   { return 301 https://$host/competencias/control-de-cambios$is_args$args; }
  location = /competencias/supplier-quality { return 301 https://$host/competencias/calidad-de-proveedores$is_args$args; }
  location = /cursos/en-vivo/operacion-segura-servicio-farmaceutico { return 301 https://$host/curso-de-operacion-segura-del-servicio-farmaceutico$is_args$args; }
  location = /cursos-gratis                { return 301 https://$host/cursos; }
  location = /escuelas/salud               { return 301 https://$host/escuelas/salud-y-farmacia-clinica$is_args$args; }
  location = /escuelas/calidad             { return 301 https://$host/escuelas/calidad-y-produccion-farmaceutica$is_args$args; }
  location = /escuelas/regulatorios        { return 301 https://$host/escuelas/asuntos-regulatorios$is_args$args; }
  location = /escuelas/marketing           { return 301 https://$host/escuelas/marketing-y-comunicacion-farmaceutica$is_args$args; }
  location = /empleo/ofertas-qf            { return 301 https://$host/empleo/ofertas-para-quimicos-farmaceuticos$is_args$args; }
  location = /empleo/correos               { return 301 https://$host/empleo/plantillas-de-correo-para-recursos-humanos$is_args$args; }
  location = /vocacion                     { return 301 https://$host/orientacion-vocacional$is_args$args; }
  location = /linkedin                     { return 301 https://$host/linkedin-farmaceutico$is_args$args; }
  location = /practicas                    { return 301 https://$host/practicas-profesionales-farmaceuticas$is_args$args; }
  location = /emprendimientos              { return 301 https://$host/emprendimiento-farmaceutico$is_args$args; }
  location = /talento                      { return 301 https://$host/vitrina-de-talento-farmaceutico$is_args$args; }
  location = /empresas/talento             { return 301 https://$host/empresas/recluta-talento-farmaceutico$is_args$args; }

  # ── Carreras, rutas y competencias ──────────────────────────
  # Salen de la base. La API arma la página con su título y su descripción
  # ya escritos o, si el nombre es anterior (tabla slugs_anteriores),
  # responde el 301 a la vigente. Si la API no responde, la aplicación.
  location ~ ^/(carreras|rutas|competencias)/[^/]+/?$ {
    proxy_pass $api_upstream/api/paginas$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @aplicacion;
  }

  location = /sitemap-profesional.xml {
    proxy_pass $api_upstream/api/sitemap-profesional.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
  }

  # /herramientas tiene carpeta propia (las páginas prerenderizadas de cada
  # herramienta): sin esto, nginx buscaría su index y respondería 403.
  location = /herramientas  { try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; expires 0; }
  location = /herramientas/ { return 301 https://$host/herramientas; }

  # ── Cursos: /curso-de-… ─────────────────────────────────────
  # Cada curso tiene su dirección descriptiva, guardada en la base de
  # datos (tabla public_slugs). La API arma la página con su título, su
  # imagen y sus datos estructurados ya escritos (las redes y los
  # buscadores no ejecutan JavaScript) o redirige si el slug es del
  # historial. Las páginas estáticas (el curso en vivo) salen de su .html.
  location ~* ^/curso-[a-z0-9-]+/?$ {
    try_files $uri.html @curso_publico;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # $request_uri y no $uri: $uri ya viene decodificado y un %0D%0A en la
  # dirección llegaría a la API como salto de línea (encabezados falsos).
  location @curso_publico {
    proxy_pass $api_upstream/api/paginas/slug$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    # Si la API no responde, se sirve la aplicación: la página se arma sola.
    proxy_intercept_errors on;
    error_page 502 503 504 = @aplicacion;
  }

  # Direcciones viejas de curso → 301 a la nueva (la API sabe cuál):
  #   /curso/53, /cursos/<slug-anterior>, /cursos-gratis/<código>
  # Los listados del catálogo (/cursos/coursera, …) siguen siendo páginas.
  location ~ ^/cursos/(coursera|udemy|edutin)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location ~ ^/(curso/[0-9]+|cursos/[^/]+|cursos-gratis/[^/]+)/?$ {
    proxy_pass $api_upstream/api/paginas$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @aplicacion;
  }

  # Todos los cursos con su dirección vigente, para los buscadores.
  location = /sitemap-cursos.xml {
    proxy_pass $api_upstream/api/sitemap-cursos.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
  }

  # La aplicación, cuando la API pide que la sirva nginx (X-Accel-Redirect)
  # o no responde. Son internas: no se pueden pedir desde fuera.
  location = /_aplicacion {
    internal;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location = /_aplicacion_404 {
    internal;
    error_page 404 /index.html;
    return 404;
  }

  location @aplicacion {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # /articulos?categoria=Gestión de calidad era un filtro con el nombre
  # codificado: ahora cada categoría tiene su página. La API normaliza el
  # nombre y responde el 301.
  location @categoria_de_articulos {
    proxy_pass $api_upstream/api/paginas/articulos$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @aplicacion;
  }

  # La ruta React /articulos choca con la carpeta publica /articulos.
  # Estas rutas exactas sirven el SPA; los .md internos bajo
  # /articulos/articulos_edvanta/... siguen sirviendose como archivos.
  location = /articulos {
    error_page 418 = @categoria_de_articulos;
    if ($arg_categoria != "") { return 418; }
    try_files /articulos.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location = /articulos/ {
    error_page 418 = @categoria_de_articulos;
    if ($arg_categoria != "") { return 418; }
    try_files /articulos.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # Cada artículo tiene su página estática (scripts/prerenderizar-articulos.mjs):
  # /articulos/<slug> sirve <slug>.html, con el texto ya escrito para el
  # buscador. Los .md siguen saliendo como archivos ().
  location ^~ /articulos/ {
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # La ruta React /recursos choca con la carpeta publica /recursos
  # (contiene checklist-levotiroxina.html). Sin estos bloques, nginx
  # redirige /recursos -> /recursos/ (directorio) -> 403. Estas rutas
  # exactas sirven el SPA; los archivos internos /recursos/<archivo>
  # se siguen sirviendo por el location / (try_files $uri).
  location = /recursos {
    try_files /index.html =404;
  }

  location = /recursos/ {
    try_files /index.html =404;
  }

  # ── Aula virtual (páginas) ─────────────────────────────────
  # Mismo SPA, con cabeceras propias. Ojo: un location con add_header no
  # hereda los add_header del servidor, por eso se repiten aquí. El aula no
  # se puede incrustar en otros sitios (protección contra clickjacking) y
  # no envía la dirección de sus páginas a sitios externos.
  location = /aula {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    expires 0;
  }

  location ^~ /aula/ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    expires 0;
  }

  # ── SPA fallback ────────────────────────────────────────────
  # Sin cache: el fallback sirve index.html para rutas del SPA
  # (/fst-app, /vida-360, etc.). Si el navegador o Cloudflare lo
  # cachearan, tras un deploy quedaría apuntando a chunks viejos
  # y aparecería "Failed to fetch dynamically imported module".
  # $uri.html: las páginas que se prerenderizan al compilar (herramientas)
  # salen con su título y su descripción ya escritos.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # ── Headers de seguridad ────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # CSP base: contenido propio, estilos inline permitidos (React inline),
  # imágenes y conexiones hacia las plataformas usadas por la plataforma.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.mercadopago.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://docs.google.com https://www.canva.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
