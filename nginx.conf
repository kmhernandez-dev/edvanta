# ============================================================
# nginx.conf — Sirve el SPA React compilado + proxy /api → backend
#
# En docker-compose, el servicio api está en la red interna
# como "api:3000" (nombre del servicio + puerto).
#
# Características:
#   - SPA fallback: cualquier ruta no existente → /index.html
#   - Cache largo para assets con hash en el nombre (/assets/*)
#   - Sin cache para index.html (para que los deploys sean inmediatos)
#   - Proxy /api/* y /health → backend Node
#   - Headers de seguridad básicos
# ============================================================

upstream edvanta_api {
    server api:3000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # ── Proxy al backend Node ───────────────────────────────────
  # Cubre: /api/create-preference, /api/mp-webhook, /api/lead-capture,
  #        /api/list-orders, /health
  location /api/ {
    proxy_pass http://edvanta_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  location = /health {
    proxy_pass http://edvanta_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # ── Assets estáticos con cache largo ────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Sin cache para index.html
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # ── SPA fallback ────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Headers de seguridad ────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}